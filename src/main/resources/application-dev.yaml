spring:
  datasource:
    url: jdbc:mysql://localhost:3306/inventario_db?serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8081

# Habilitar Swagger UI
springdoc:
  swagger-ui:
    enabled: true
